name: Release and Update Formula

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.1.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
      version: ${{ steps.tag.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Determine version and tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="v${VERSION}"
          else
            TAG_NAME="${{ github.ref_name }}"
            VERSION="${TAG_NAME#v}"
          fi

          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Tag: ${TAG_NAME}, Version: ${VERSION}"

      - name: Create tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG_NAME="${{ steps.tag.outputs.tag_name }}"
          git tag "${TAG_NAME}"
          git push origin "${TAG_NAME}"

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [[ -z "$PREVIOUS_TAG" ]]; then
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          CHANGELOG=$(mktemp)
          echo "## 🚀 What's New in ${{ steps.tag.outputs.version }}" >> "$CHANGELOG"
          echo "" >> "$CHANGELOG"
          git log --pretty=format:"- %s" "${PREVIOUS_TAG}..${{ steps.tag.outputs.tag_name }}" | head -20 >> "$CHANGELOG"
          echo "" >> "$CHANGELOG"
          echo "## 📋 Installation" >> "$CHANGELOG"
          echo '```bash' >> "$CHANGELOG"
          echo 'brew tap yinzhenyu-su/homebrew-tools' >> "$CHANGELOG"
          echo 'brew install switch-claude' >> "$CHANGELOG"
          echo '```' >> "$CHANGELOG"

          # Use a delimiter that won't appear in content
          echo "CHANGELOG<<GHA_EOF" >> $GITHUB_OUTPUT
          cat "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "GHA_EOF" >> $GITHUB_OUTPUT
          rm "$CHANGELOG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Switch Claude ${{ steps.tag.outputs.version }}"
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: false

  update-formula:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and calculate SHA256
        id: sha256
        run: |
          TAG_NAME="${{ needs.release.outputs.tag_name }}"
          VERSION="${{ needs.release.outputs.version }}"

          TARBALL_URL="https://github.com/${{ github.repository }}/archive/${TAG_NAME}.tar.gz"
          echo "下载 tarball: ${TARBALL_URL}"

          curl -L -o "/tmp/release.tar.gz" "${TARBALL_URL}"
          SHA256=$(sha256sum "/tmp/release.tar.gz" | cut -d ' ' -f 1)

          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT
          echo "tarball_url=${TARBALL_URL}" >> $GITHUB_OUTPUT
          echo "Calculated SHA256: ${SHA256}"

      - name: Update Formula (version + url + sha256 only)
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          SHA256="${{ steps.sha256.outputs.sha256 }}"
          FORMULA="Formula/switch-claude.rb"

          # 备份
          cp "$FORMULA" "${FORMULA}.bak"

          # 只替换三个字段，保留 caveats/test 等完整内容
          sed -i "s|^  url \".*\"|  url \"https://github.com/${{ github.repository }}/archive/v${VERSION}.tar.gz\"|" "$FORMULA"
          sed -i "s|^  version \".*\"|  version \"${VERSION}\"|" "$FORMULA"
          sed -i "s|^  sha256 \".*\"|  sha256 \"${SHA256}\"|" "$FORMULA"

          echo "Formula 已更新:"
          echo "  版本: ${VERSION}"
          echo "  SHA256: ${SHA256}"

      - name: Verify Formula syntax
        run: |
          ruby -c "Formula/switch-claude.rb"
          echo "✅ Formula 语法正确"

      - name: Commit and push changes
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          FORMULA="Formula/switch-claude.rb"

          git add "$FORMULA"

          if ! git diff --staged --quiet; then
            git commit -m "chore: update switch-claude to v${VERSION}

            - Update version to ${VERSION}
            - Update SHA256 hash
            - Update download URL

            Auto-generated by GitHub Actions"

            git push origin main
            echo "✅ Formula 更新已提交并推送"
          else
            echo "ℹ️  无变更需要提交"
          fi

  notify:
    needs: [release, update-formula]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Notify completion
        run: |
          if [[ "${{ needs.update-formula.result }}" == "success" ]]; then
            echo "🎉 发布成功完成！"
            echo "📦 版本: ${{ needs.release.outputs.version }}"
            echo "🏷️  标签: ${{ needs.release.outputs.tag_name }}"
            echo "📥 安装命令:"
            echo "   brew tap yinzhenyu-su/homebrew-tools"
            echo "   brew install switch-claude"
          else
            echo "❌ 发布过程中出现错误"
            exit 1
          fi
